<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Create InkFlowzPrt Account</title>
    <meta name="description"
        content="Sign up for InkFlowzPrt. Create a free client account to submit printing artwork, track banner and brochure orders, and easily place repeat print jobs.">
    <meta name="keywords"
        content="print shop signup, create print account, upload printing files, copy center account registration, visiting cards print signup">
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        if (localStorage.getItem('rtl') === 'true') document.documentElement.setAttribute('dir', 'rtl');
    </script>
</head>

<body>
    <div class="auth-nav-icons">
        <span id="rtl-toggle" class="nav-icon fw-bold me-2" title="Toggle RTL" style="font-size: 0.9rem; width: 32px; display: inline-block; text-align: center;">
            RTL
        </span>
        <span id="theme-toggle" class="nav-icon" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </span>
    </div>

    <div class="auth-page-wrapper position-relative">


        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8 col-sm-11">
                    <div class="card auth-card p-4">
                        <div class="card-body">
                            <a href="index.html" class="auth-logo d-block text-center mb-3">
                                <img src="img/logo1.png" alt="InkFlowzPrt" class="brand-logo-img auth-logo-img">
                            </a>

                            <div class="text-center mb-4">
                                <h1 class="h3 fw-bold font-heading">Create Account</h1>
                                <p class="text-muted small">Join InkFlowzPrt Client Portal</p>
                            </div>

                            <form action="dashboard.html" class="needs-validation" novalidate>
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="firstname" class="form-label fw-bold small">First Name</label>
                                        <input type="text" class="form-control p-3 bg-light border-0" id="firstname"
                                            placeholder="First Name" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="lastname" class="form-label fw-bold small">Last Name</label>
                                        <input type="text" class="form-control p-3 bg-light border-0" id="lastname"
                                            placeholder="Last Name" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-bold small">Email Address</label>
                                    <input type="email" class="form-control p-3 bg-light border-0" id="email"
                                        placeholder="Email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label fw-bold small">Password</label>
                                    <div class="password-field">
                                        <input type="password" class="form-control p-3 bg-light border-0" id="password"
                                            placeholder="Min. 8 characters" required>
                                        <span class="toggle-password">
                                            <i class="fas fa-eye"></i>
                                        </span>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="confirm-password" class="form-label fw-bold small">Confirm
                                        Password</label>
                                    <div class="password-field">
                                        <input type="password" class="form-control p-3 bg-light border-0"
                                            id="confirm-password" placeholder="Repeat password" required>
                                        <span class="toggle-password">
                                            <i class="fas fa-eye"></i>
                                        </span>
                                    </div>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="terms" required>
                                    <label class="form-check-label text-muted small" for="terms">I agree to the <a
                                            href="#" class="text-decoration-none">Terms & Conditions</a></label>
                                </div>
                                <div class="d-grid gap-2 mt-4">
                                    <button class="btn btn-primary-custom btn-lg rounded-pill py-3" type="submit">Sign
                                        Up</button>
                                </div>
                            </form>

                            <div class="social-auth-btns">
                                <a href="#" class="btn-social btn-google">
                                    <i class="fab fa-google"></i> Google
                                </a>
                                <a href="#" class="btn-social btn-apple">
                                    <i class="fab fa-apple"></i> Apple
                                </a>
                            </div>

                            <div class="text-center mt-4">
                                <p class="text-muted small mb-0">Already have an account? <a href="login.html"
                                        class="text-primary fw-bold text-decoration-none">Log In</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
